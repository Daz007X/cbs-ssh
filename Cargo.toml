[package]
name = "cbs-ssh"
version = "1.0.0"
edition = "2024"
description = "SSH launcher with an interactive Ratatui server picker backed by server.json"
license = "MIT"
readme = "README.md"

[dependencies]
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
